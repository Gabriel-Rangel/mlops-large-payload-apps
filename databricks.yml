# Databricks Asset Bundle — score de payloads grandes (até ~29 MB) com uma Databricks App.
#
#   Credit Engine ──POST (15 variáveis + JSON do birô)──► Databricks App ──► 202
#   App: request.json no Volume → score do @Champion → response_dbx.json no Volume
#   Volume EXTERNAL no bucket S3 do cliente: o response_dbx.json dispara S3 → SNS → response router
#
# Ordem de implantação: ver README.md.

bundle:
  name: mlops-large-payload-apps

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo do Unity Catalog do ambiente
  schema:
    description: Schema do projeto (modelo, Volume, tabela de observabilidade)
    default: large_payload_apps
  model_name:
    description: Nome do modelo registrado no Unity Catalog
    default: large_payload_scorer
  app_name:
    description: Nome da Databricks App (minúsculas, números e hífen, até 30 caracteres)
    default: large-payload-scoring
  experiment_path:
    description: Experimento MLflow do treino
    default: /Shared/${bundle.name}/${bundle.target}
  warehouse_id:
    description: SQL warehouse usado pela App para gravar a tabela de observabilidade
  payload_volume:
    description: Volume com request.json / response_dbx.json
    default: payloads
  payload_volume_type:
    description: EXTERNAL (bucket S3 do cliente; precisa de external location) ou MANAGED (storage do workspace)
    default: EXTERNAL
  payload_s3_url:
    description: Local S3 do Volume EXTERNAL, ex. s3://<bucket>/payloads/ (vazio se MANAGED)
    default: ""
  secret_scope:
    description: Secret scope com o OAuth do service principal cliente (usado pelo job de validação)
    default: mlops-large-payload-apps
  client_sp_app_id:
    description: Application ID do service principal que chama a App (Credit Engine)
    lookup:
      service_principal: credit-engine-client

targets:
  dev:
    default: true
    # Sem `mode: development` de propósito: esse modo prefixa o schema com o nome do usuário,
    # e o caminho do Volume faz parte do contrato com o lado AWS.
    variables:
      catalog: <catalogo_dev>
      warehouse_id: <warehouse_id>
      payload_s3_url: s3://<bucket>/payloads/
      app_name: large-payload-scoring-dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # Em produção, implante por CI com um service principal (run_as) e não com usuário pessoal.
    variables:
      catalog: <catalogo_prod>
      warehouse_id: <warehouse_id>
      payload_s3_url: s3://<bucket>/payloads/
